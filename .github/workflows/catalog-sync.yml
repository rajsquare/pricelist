name: Catalog Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate catalog
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/syncProducts.mjs

      - name: Preserve generated file
        run: cp public/products.json /tmp/products.json

      - name: Push products.json to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/products.json products.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Auto-update catalog"
          git push origin gh-pages
