name: Sync Products JSON

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync products
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/syncProducts.mjs

      - name: Commit products.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/products.json
          git diff --staged --quiet || git commit -m "Auto-sync products JSON"
          git push